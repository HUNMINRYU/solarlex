<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolarLex</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20x%3D%226%22%20y%3D%2212%22%20width%3D%226%22%20height%3D%2240%22%20rx%3D%223%22%20fill%3D%22%233d5bd9%22/%3E%3Crect%20x%3D%2215%22%20y%3D%2212%22%20width%3D%226%22%20height%3D%2240%22%20rx%3D%223%22%20fill%3D%22%23b5651d%22/%3E%3Crect%20x%3D%2224%22%20y%3D%2212%22%20width%3D%226%22%20height%3D%2240%22%20rx%3D%223%22%20fill%3D%22%232f8a4f%22/%3E%3Crect%20x%3D%2233%22%20y%3D%2212%22%20width%3D%226%22%20height%3D%2240%22%20rx%3D%223%22%20fill%3D%22%230f7f8a%22/%3E%3Crect%20x%3D%2242%22%20y%3D%2212%22%20width%3D%226%22%20height%3D%2240%22%20rx%3D%223%22%20fill%3D%22%237a4fd1%22/%3E%3Crect%20x%3D%2251%22%20y%3D%2212%22%20width%3D%226%22%20height%3D%2240%22%20rx%3D%223%22%20fill%3D%22%23c0394b%22/%3E%3C/svg%3E">
<meta name="description" content="서울특별시 조례 6종 원문에서 근거 조항을 찾아 답합니다.">
<!-- 공공서비스용 서체 Pretendard GOV(KRDS 표준, OFL). 공식 동적 서브셋을 서버가 직접 내보내 외부 CDN 없이도 같은 화면입니다. -->
<script>try { if (localStorage.getItem("solarlex-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) {}</script>
<link rel="stylesheet" href="/fonts/pretendard-gov-dynamic-subset.css">
<style>
  /* 색은 KRDS(대한민국 정부 디자인 시스템) 토큰 기준. 조례 6종에만 노선 색을 따로 둡니다. 간격은 8px 단위 */
  :root {
    --ink: #1e2124; --ink-2: #464c53; --ink-3: #6d7882;
    --line: #cdd1d5; --line-soft: #e6e8ea;
    --bg: #ffffff; --bg-soft: #f4f5f6; --bg-canvas: #fafbfc;
    --primary: #256ef4; --primary-ink: #0b50d0; --primary-wash: #ecf2fe;
    --warn-ink: #8a5c00; --warn-wash: #fff3db; --warn-line: #ffe0a3;
    --danger-ink: #bd2c0f; --danger-wash: #fdefec; --danger-line: #f7c7bd;
    --ord-주차장: #3d5bd9; --ord-동물보호: #b5651d; --ord-자전거: #2f8a4f;
    --ord-도시공원: #0f7f8a; --ord-청년: #7a4fd1; --ord-금연: #c0394b;
    --font: "Pretendard GOV Variable", "Pretendard GOV", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --wrap: 70rem;
  }
  * { box-sizing: border-box; }
  html { font-size: 100%; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 1.0625rem; line-height: 1.65;
    text-rendering: optimizeLegibility;
  }
  /* 한글은 어절 단위로 줄바꿈하고, 긴 조례명·URL만 필요할 때 끊습니다 */
  :lang(ko) { word-break: keep-all; overflow-wrap: anywhere; }
  ::selection { background: var(--primary-wash); color: var(--ink); }
  a { color: var(--primary-ink); text-underline-offset: 3px; }
  :where(a, button, summary, textarea, [tabindex]):focus-visible { outline: 3px solid var(--primary-ink); outline-offset: 3px; border-radius: 4px; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .wrap { max-width: calc(var(--wrap) + 48px); margin: 0 auto; padding-left: 24px; padding-right: 24px; }
  button { font: inherit; color: inherit; }

  /* ---- 조례 6종 노선 색 표시 ---- */
  .mark { display: inline-flex; gap: 3px; }
  .mark i { width: 4px; height: 22px; border-radius: 2px; background: var(--c); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
  .badge { display: inline-flex; align-items: center; padding: 1px 10px; border-radius: 999px; background: var(--c); color: #fff; font-size: 0.75rem; font-weight: 700; line-height: 1.6; white-space: nowrap; flex: none; }

  /* ---- 상단 막대 ---- */
  .topbar { border-bottom: 1px solid var(--line-soft); }
  .topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-size: 1.125rem; font-weight: 700; }
  .basis { margin: 0; font-size: 0.875rem; color: var(--ink-3); }

  main.wrap { padding-top: 40px; padding-bottom: 72px; }

  /* ---- 첫 화면 머리 ---- */
  .hero { padding-top: 48px; margin-bottom: 28px; }
  .hero h1 { margin: 0; font-size: 3.5rem; line-height: 1.25; font-weight: 700; letter-spacing: -0.02em; }
  .hero .lede { margin: 16px 0 0; max-width: 36em; font-size: 1.3125rem; line-height: 1.6; color: var(--ink-2); }
  body.asked .hero { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); padding: 0; margin: 0; }

  /* ---- 질문 상자 ----
     첫 화면: [질문] [입력] [다루는 조례 | 질문하기]
     답변 화면: [질문] [입력 | 질문하기] [다루는 조례] */
  .ask {
    display: grid; grid-template-columns: 1fr auto; grid-template-areas: "label label" "input input" "scope btn";
    gap: 12px 24px; align-items: center;
    border: 1.5px solid var(--line); border-radius: 16px; background: var(--bg); padding: 24px 28px 20px;
    box-shadow: 0 8px 24px rgba(30, 33, 36, .06); transition: border-color .15s, box-shadow .15s;
  }
  .ask:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-wash); }
  .ask label { grid-area: label; font-size: 0.875rem; font-weight: 600; color: var(--ink-2); }
  .ask textarea {
    grid-area: input; display: block; width: 100%; border: 0; resize: none; outline: none; background: transparent; padding: 0;
    font: inherit; font-size: 1.5rem; line-height: 1.5; color: var(--ink); min-height: 1.5em;
  }
  .ask textarea::placeholder { color: var(--ink-3); }
  .scope { grid-area: scope; display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0; padding: 0; list-style: none; font-size: 0.8125rem; color: var(--ink-3); }
  .scope li { display: inline-flex; align-items: center; gap: 6px; }
  .ask .btn-primary { grid-area: btn; }
  .ask-actions { grid-area: btn; display: flex; align-items: center; gap: 8px; }
  .ask-actions .btn-primary { flex: 1; }
  .voice-btn { display: inline-grid; place-items: center; flex: none; width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--card); color: var(--ink-2); cursor: pointer; }
  .voice-btn[hidden] { display: none; }
  .voice-btn:hover { color: var(--ink); border-color: var(--primary); }
  .voice-btn[aria-pressed="true"] { background: #c0392b; border-color: #c0392b; color: #fff; }
  .voice-btn:disabled { opacity: .5; cursor: progress; }
  .listen { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 16px 0 0; font-size: 0.8125rem; color: var(--ink-3); }
  .listen[hidden] { display: none; }
  .next-questions { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 20px; }
  .next-questions p { margin: 0; font-weight: 600; }
  .next-questions .btn-quiet { margin-top: 0; height: auto; min-height: 40px; padding: 8px 16px; text-align: left; white-space: normal; }
  .loading > .btn-quiet { margin-top: 16px; }
  .ask textarea[readonly] { color: var(--ink-2); }
  body.asked .ask { grid-template-areas: "label label" "input btn" "scope scope"; border-width: 2px; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 110, 244, .12); padding: 20px 24px; }
  body.asked .ask textarea { font-size: 1.375rem; font-weight: 500; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; padding: 0 30px; border-radius: 10px; border: 1px solid transparent;
    font-size: 1.0625rem; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .btn-primary { background: var(--primary-ink); color: #fff; }
  .btn-primary:hover { background: #083f9f; }
  .btn-primary:disabled { background: #8aa9e6; cursor: progress; }
  .btn-quiet { min-height: 40px; padding: 0 16px; background: var(--bg); color: var(--ink-2); border-color: var(--line); font-size: 0.9375rem; border-radius: 8px; }
  .btn-quiet:hover { background: var(--bg-soft); }

  /* ---- 예시 질문 ---- */
  .examples { margin-top: 28px; }
  .examples h2 { margin: 0 0 12px; font-size: 0.9375rem; font-weight: 600; color: var(--ink-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--bg); font-size: 0.9375rem; cursor: pointer; white-space: nowrap;
  }
  .chip:hover, .chip[aria-current="true"] { border-color: var(--primary); background: var(--primary-wash); }
  .chip b { font-weight: 700; color: var(--primary-ink); }

  /* ---- 첫 화면 아래: 다루는 조례 6종, 답하는 방식 ---- */
  .lines { margin-top: 72px; }
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin: 0 0 20px; }
  .sec-head h2 { margin: 0; font-size: 1.25rem; font-weight: 700; }
  .sec-head p { margin: 0; font-size: 0.875rem; color: var(--ink-3); }
  .line-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 24px; margin: 0; padding: 0; list-style: none; }
  .line-list li { display: grid; gap: 10px; font-size: 0.9375rem; font-weight: 500; }
  .rail { display: flex; align-items: center; }
  .rail::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 4px solid var(--c); background: var(--bg); flex: none; box-sizing: border-box; }
  .rail::after { content: ""; height: 5px; flex: 1; background: var(--c); }
  .ways { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line-soft); }
  .ways h3 { margin: 0 0 8px; font-size: 1.0625rem; font-weight: 700; }
  .ways p { margin: 0; font-size: 0.9375rem; line-height: 1.65; color: var(--ink-2); }
  body.asked .intro { display: none; }

  /* ---- 결과 ---- */
  #result { scroll-margin-top: 16px; }
  #result:not(:empty) { margin-top: 32px; padding-top: 40px; border-top: 1px solid var(--line-soft); }
  .q-echo { margin: 0 0 12px; font-size: 0.875rem; color: var(--ink-3); }

  .answer-head { max-width: 48rem; }
  /* ---- 답변 아래 탭 ---- */
  .tabs { margin-top: 48px; }
  .tablist { display: flex; gap: 8px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tablist::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; margin-bottom: -1px; border: 0; border-bottom: 3px solid transparent; background: none; font-size: 1.0625rem; font-weight: 600; color: var(--ink-3); cursor: pointer; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--primary-ink); }
  .tab .cnt { min-width: 24px; padding: 0 8px; border-radius: 999px; background: var(--bg-soft); color: var(--ink-2); font-size: 0.8125rem; line-height: 1.7; text-align: center; font-variant-numeric: tabular-nums; }
  .tab[aria-selected="true"] .cnt { background: var(--primary-wash); color: var(--primary-ink); }
  .tab .sm { display: none; }
  .tab-panel { padding-top: 24px; }
  .tab-panel:focus-visible { outline: none; }
  .panel-note { margin: 0 0 16px; font-size: 0.9375rem; color: var(--ink-2); }
  .sources { max-width: 52rem; }
  .tab-panel .kg { margin-top: 0; }
  .tab-panel .kg .sub { margin-top: 0; }
  .rel-group + .rel-group { margin-top: 32px; }
  .rel-group h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1.0625rem; font-weight: 700; }
  .rel-group h3 .n { font-size: 0.875rem; font-weight: 500; color: var(--ink-3); }
  .related .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-top: 6px; }
  .related .acts .src-link { margin-top: 0; }
  .extras ul { max-width: 52rem; margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line-soft); }
  .extras li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line-soft); }
  .extras .rel-kind { justify-self: start; align-self: start; padding: 1px 10px; border-radius: 6px; background: var(--bg-soft); color: var(--ink-2); font-size: 0.8125rem; font-weight: 600; line-height: 1.7; white-space: nowrap; }
  .extras b { display: block; font-size: 1rem; }
  .extras .why { display: block; margin-top: 2px; font-size: 0.875rem; color: var(--ink-3); }
  .conclusion { margin: 0; font-size: 2.5rem; line-height: 1.3; font-weight: 700; letter-spacing: -0.015em; }
  .conclusion.long { font-size: 1.75rem; line-height: 1.4; }
  .detail { margin: 20px 0 0; font-size: 1.1875rem; line-height: 1.7; }
  .refs { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; padding: 0; list-style: none; }
  .ref { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px 0 6px; border-radius: 8px; border: 0; background: var(--primary-wash); color: var(--primary-ink); font-size: 0.9375rem; font-weight: 700; cursor: pointer; }
  .ref:hover { background: #dbe7fd; }
  .ref .n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--primary-ink); color: #fff; font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  .trust { display: flex; align-items: flex-start; gap: 8px; margin: 20px 0 0; font-size: 0.8125rem; color: var(--ink-3); }
  .trust svg { flex: none; margin-top: 2px; }

  .cross { margin-top: 24px; padding: 18px 20px; border-radius: 12px; background: var(--bg-soft); }
  .cross h2 { margin: 0; font-size: 1rem; font-weight: 700; }
  .cross > p { margin: 6px 0 14px; font-size: 0.875rem; color: var(--ink-2); }
  .cross ul { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .cross li { display: flex; gap: 12px; align-items: flex-start; }
  .cross .badge { margin-top: 2px; }
  .cross .items { font-size: 0.9375rem; font-weight: 500; }
  .cross .items button { padding: 0; border: 0; background: none; color: var(--primary-ink); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
  .cross .why { display: block; margin-top: 2px; font-size: 0.8125rem; font-weight: 400; color: var(--ink-3); }

  /* 근거 원문 */
  .sources h2 { margin: 0 0 12px; font-size: 1.0625rem; font-weight: 700; }
  .source { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  .source + .source { margin-top: 12px; }
  .source[open] { border-color: var(--primary); box-shadow: inset 0 0 0 .5px var(--primary); }
  .source summary { list-style: none; cursor: pointer; padding: 18px 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; }
  .source summary::-webkit-details-marker { display: none; }
  .source .num { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--primary-wash); color: var(--primary-ink); font-weight: 700; font-size: 0.875rem; font-variant-numeric: tabular-nums; }
  .source[open] .num { background: var(--primary-ink); color: #fff; }
  .source .title { display: block; font-weight: 700; font-size: 1rem; line-height: 1.5; }
  .source .meta { display: block; margin-top: 2px; font-size: 0.8125rem; color: var(--ink-3); }
  .source .chev { width: 20px; height: 20px; margin-top: 4px; color: var(--ink-3); transition: transform .15s; }
  .source[open] .chev { transform: rotate(180deg); }
  .source .body { padding: 0 20px 18px; }
  .quote { margin: 0; padding: 14px 16px; border-left: 3px solid var(--primary); border-radius: 0 8px 8px 0; background: var(--bg-soft); font-size: 0.9375rem; line-height: 1.75; }
  .quote p { margin: 0; white-space: pre-wrap; }
  .quote p + p { margin-top: 10px; }
  .quote .hit { font-weight: 700; }
  .quote .gap, .quote .amend { font-size: 0.8125rem; color: var(--ink-3); }
  .more { margin-top: 10px; padding: 0; border: 0; background: none; color: var(--ink-2); font-size: 0.8125rem; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .src-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 0.875rem; font-weight: 700; min-height: 32px; }

  /* ---- 오프라인 시연 띠 ---- */
  .offline { display: flex; align-items: center; gap: 10px; margin: 0 0 24px; padding: 10px 16px; border: 1px solid var(--warn-line); border-radius: 10px; background: var(--warn-wash); color: var(--warn-ink); font-size: 0.9375rem; font-weight: 500; }
  .offline svg { flex: none; }

  /* ---- 연관 조례 지도 ---- */
  .kg { margin-top: 64px; }
  .kg h2 { margin: 0; font-size: 1.625rem; line-height: 1.35; font-weight: 700; }
  .kg .sub { margin: 8px 0 16px; max-width: 47.5rem; font-size: 1rem; line-height: 1.65; color: var(--ink-2); }
  .kg-box { border: 1px solid var(--line); border-radius: 16px; background: var(--bg-canvas); overflow: hidden; }
  .kg-box svg { display: block; width: 100%; height: auto; }
  .kg-box svg text { font-family: var(--font); }
  .kg-hit { cursor: pointer; }
  .kg-hit:focus { outline: none; }
  .kg-hit:focus-visible .ring { stroke: var(--primary-ink); stroke-width: 3; stroke-dasharray: 4 3; }
  .kg-route, .kg-el { transition: opacity .2s; }
  .kg-info { display: flex; align-items: center; gap: 32px; padding: 22px 28px; background: var(--bg); border-top: 1px solid var(--line-soft); min-height: 84px; }
  .kg-info .txt { flex: 1; min-width: 0; }
  .kg-info .hint { margin: 0; font-size: 0.9375rem; color: var(--ink-3); }
  .kg-info .head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .kg-info .head strong { font-size: 1.1875rem; }
  .kg-info .desc { margin: 6px 0 0; font-size: 0.9375rem; line-height: 1.65; color: var(--ink-2); }
  .kg-info .qt { margin: 4px 0 0; font-size: 0.875rem; line-height: 1.65; color: var(--ink-3); }
  .kg-info .act { display: grid; justify-items: end; gap: 8px; flex: none; }
  .kg-info .act small { font-size: 0.75rem; color: var(--ink-3); }
  .hub-tag { display: inline-flex; align-items: center; padding: 1px 12px; border: 2px solid var(--ink); border-radius: 999px; font-size: 0.875rem; font-weight: 700; background: var(--bg); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 16px 0 0; padding: 0; list-style: none; font-size: 0.8125rem; color: var(--ink-2); }
  .legend li { display: inline-flex; align-items: center; gap: 8px; }
  .legend i { display: inline-block; flex: none; }

  /* 좁은 화면용 세로 노선 */
  .kg-v { margin: 0; padding: 18px 16px; list-style: none; }
  .kg-v li { display: grid; grid-template-columns: 24px 1fr; gap: 0 14px; }
  .kg-v .rl { position: relative; }
  .kg-v .rl::before { content: ""; position: absolute; left: 10px; top: 14px; bottom: -14px; width: 4px; background: var(--c, var(--line)); }
  .kg-v li:last-child .rl::before { display: none; }
  .kg-v .st { position: absolute; left: 5px; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--bg); border: 4px solid var(--c); box-sizing: border-box; }
  .kg-v .st.q { background: var(--ink); border-color: var(--ink); }
  .kg-v .st.cited { left: 3px; top: 4px; width: 18px; height: 18px; background: var(--primary-ink); border: 3px solid var(--bg); box-shadow: 0 0 0 4px var(--primary-wash); }
  .kg-v .bd { padding-bottom: 18px; }
  .kg-v .bd > b { display: block; font-size: 0.9375rem; line-height: 1.5; }
  .kg-v .bd > span:not(.badge) { display: block; font-size: 0.8125rem; color: var(--ink-2); }
  .kg-v .cited b { color: var(--primary-ink); }

<script>
const $ = (s) => document.querySelector(s);
const form = $("#ask-form"), input = $("#question"), submit = $("#submit"), result = $("#result"), live = $("#live");
const SLOW_MS = 10000;          // 이 시간을 넘기면 '시간이 걸리고 있어요' 안내와 중단 버튼
const NARROW = matchMedia("(max-width: 54.99rem)");   // 이보다 좁으면 연관 조례 지도를 세로 노선으로 그립니다
const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let controller = null, tick = null, current = null;

const ICON = {
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',

  info: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  alert: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>',
  shield: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
  wifiOff: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2-1.6M2 8.8a15 15 0 0 1 4.2-2.6M22 8.8A15 15 0 0 0 10.7 5M12 20h.01"/></svg>',
};

function el(tag, attrs = {}, html) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (html !== undefined) n.innerHTML = html;
  return n;
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shortLabel = (label) => String(label || "").replace("서울특별시 ", "");
const articleOnly = (label) => (String(label).match(/(제\d+조(?:의\d+)?(?:\s?제\d+항)?|별표\s?\d*)$/) || [label])[0];
const dateKo = (d) => d ? d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, (_, y, m, day) => `${y}. ${+m}. ${+day}.`) : "";
const scrollTo = (node, block = "nearest") => node.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block });

// 조례 6종 아이콘(선 그림). 색은 조례 노선 색을 씁니다
const ORD_SVG = {
  주차장: '<rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M10 17V7.5h3.2a3 3 0 0 1 0 6H10"/>',
  동물보호: '<circle cx="6.5" cy="10" r="1.7"/><circle cx="10" cy="6.2" r="1.7"/><circle cx="14.5" cy="6.2" r="1.7"/><circle cx="18" cy="10" r="1.7"/><path d="M8 17.2c0-2.7 2-5.2 4.2-5.2s4.3 2.5 4.3 5c0 1.6-1.2 2.3-2.4 2-1-.3-1.3-.5-1.9-.5s-.9.2-1.9.5C9.1 19.3 8 18.6 8 17.2z"/>',
  자전거: '<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l3.5-6.5h6L18 16M9.5 9.5 12.5 16H6M13.5 6.5H16"/>',
  도시공원: '<path d="M12 21v-5"/><path d="M12 3c3 0 5.3 2.3 5.3 5.1 0 .6-.1 1.1-.3 1.6A3.4 3.4 0 0 1 15.8 16H8.2A3.4 3.4 0 0 1 7 9.7a4.8 4.8 0 0 1-.3-1.6C6.7 5.3 9 3 12 3z"/>',
  청년: '<path d="M12 21v-8.5"/><path d="M12 12.5c0-4 2.9-6.6 7-6.6 0 4-2.9 6.6-7 6.6zM12 14.5c0-3.2-2.3-5.3-5.6-5.3 0 3.2 2.3 5.3 5.6 5.3z"/>',
  금연: '<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12M7.5 13.5h5.5M15 13.5h1.5"/>',
};
const ordIcon = (lawOrKey, cls = "mini") => { const k = ORD_SVG[lawOrKey] ? lawOrKey : ordKey(lawOrKey); return k ? `<span class="oi ${cls}" style="--c:var(--ord-${k})" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ORD_SVG[k]}</svg></span>` : ""; };
// 도우미의 답은 왼쪽 아바타 + 이름 아래 열에 담습니다(질문은 오른쪽 말풍선)
function botReply(...nodes) {
  const row = el("div", { class: "bot-row" }, '<span class="avatar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span><b class="bot-name">SolarLex</b>');
  const col = el("div", { class: "bot-col" });
  col.append(...nodes); row.append(col);
  return row;
}

// 조례 6종의 노선 색. 조례 이름에 들어 있는 낱말로 찾습니다
const ORD = ["주차장", "동물보호", "자전거", "도시공원", "청년", "금연"];
const ordKey = (law) => ORD.find((k) => String(law || "").includes(k)) || "";
const ordColor = (law) => { const k = ordKey(law); return k ? `var(--ord-${k})` : "var(--ink-3)"; };
const ordShort = (law) => { const k = ordKey(law); return k ? `${k} 조례` : shortLabel(law); };
// "주차장 조례 제7조 제1항"처럼 짧게
const shortArticle = (label, law) => `${ordShort(law || label)} ${articleOnly(label)}`;

// 조각 머리글([조례명 제N조(제목)])과 별표의 HTML 표 태그를 읽기 좋은 글로 바꿉니다
function plainClause(text) {
  return String(text || "").replace(/^\[[^\]]*\]\n/, "")
    .replace(/<\/tr>/g, "\n").replace(/<\/t[dh]>/g, "  ").replace(/<\/?(?:table|tr|td|th|tbody|thead|br)[^>]*>/g, "").trim();
}
const clauseTitle = (text) => ((String(text || "").match(/^\[[^\]]*?\(([^)]+)\)\]/) || [])[1] || "");

// 첫 문장을 결론으로, 나머지를 설명으로 나눕니다
function splitConclusion(answer) {
  const m = answer.match(/^(.+?[.다요])(\s+)([\s\S]*)$/);
  return m ? [m[1], m[3]] : [answer, ""];
}

// <개정 2010.7.15, ...> 같은 개정 날짜 목록을 '개정 이력 24건, 마지막 개정 2026. 10. 1.' 한 줄로 줄입니다
function splitAmendments(text) {
  let count = 0, last = "", other = [];
  const body = text.replace(/[ \t]*<([^<>]*\d{4}\s*\.[^<>]*)>/g, (_, inner) => {
    const dates = inner.match(/\d{4}\s*\.\s*\d{1,2}\s*\.\s*\d{1,2}/g) || [];
    const kind = (inner.match(/^[^\d]*/) || [""])[0].trim();
    if (kind.includes("개정")) count += dates.length; else if (kind) other.push(`${kind} ${dates.map(normDate).join(", ")}`);
    for (const d of dates) if (dateNum(d) > dateNum(last)) last = d;
    return "";
  });
  const parts = [];
  if (count) parts.push(`개정 이력 ${count}건, 마지막 개정 ${normDate(last)}`);
  parts.push(...other);
  return { body, note: parts.join(". ") };
}
const dateNum = (d) => { const m = String(d).match(/(\d{4})\s*\.\s*(\d{1,2})\s*\.\s*(\d{1,2})/); return m ? +m[1] * 1e4 + +m[2] * 100 + +m[3] : 0; };
const normDate = (d) => { const m = String(d).match(/(\d{4})\s*\.\s*(\d{1,2})\s*\.\s*(\d{1,2})/); return m ? `${m[1]}. ${+m[2]}. ${+m[3]}.` : d; };

// 답변에 나온 호(예: 제7조 제1항 제7호)를 찾습니다
function citedItems(answer, label) {
  const head = (String(label).match(/(제\d+항)$/) || String(label).match(/(제\d+조(?:의\d+)?)$/) || [])[1];
  if (!head) return new Set();
  const re = new RegExp(`${head}\\s*제(\\d+(?:의\\d+)?)호`, "g");
  return new Set([...String(answer).matchAll(re)].map((m) => m[1]));
}

// 근거 원문: 답에 쓰인 호만 굵게 보여 주고 나머지 호는 '⋯ 1호~6호 생략'으로 접습니다. '원문 전체 보기'로 모두 펼칩니다
function clauseHtml(text, keep = new Set()) {
  const { body, note } = splitAmendments(plainClause(text));
  const lines = body.split("\n").map((s) => s.replace(/\s+$/, "")).filter((s) => s.trim());
  const itemNo = (s) => (s.match(/^\s*(\d+(?:의\d+)?)\.\s/) || [])[1];
  const blocks = []; let cur = { no: null, lines: [] };
  for (const s of lines) {
    const no = itemNo(s);
    if (no) { if (cur.lines.length) blocks.push(cur); cur = { no, lines: [s] }; } else cur.lines.push(s);
  }
  if (cur.lines.length) blocks.push(cur);
  const items = blocks.filter((b) => b.no);
  const hit = (b) => b.no && keep.has(b.no);
  const p = (b, cls = "") => `<p${cls ? ` class="${cls}"` : ""}>${esc(b.lines.join("\n"))}</p>`;
  const full = blocks.map((b) => p(b, hit(b) ? "hit" : "")).join("") + (note ? `<p class="amend">${esc(note)}</p>` : "");
  if (items.length < 3 || !items.some(hit)) return { short: full, full, folded: false };
  let out = "", skipped = [];
  const flush = () => { if (skipped.length) out += `<p class="gap">⋯ ${esc(skipped[0])}호${skipped.length > 1 ? `~${esc(skipped[skipped.length - 1])}호` : ""} 생략</p>`; skipped = []; };
  for (const b of blocks) {
    if (!b.no) { flush(); out += p(b); }
    else if (hit(b)) { flush(); out += p(b, "hit"); }
    else skipped.push(b.no);
  }
  flush();
  return { short: out + (note ? `<p class="amend">${esc(note)}</p>` : ""), full, folded: true };
}

function quoteBox(text, keep) {
  const c = clauseHtml(text, keep);
  const wrap = el("div");
  const q = el("div", { class: "quote" }, c.short);
  wrap.append(q);
  if (c.folded) {
    const more = el("button", { type: "button", class: "more", "aria-expanded": "false" }, "원문 전체 보기");
    more.onclick = () => { const open = more.getAttribute("aria-expanded") === "true"; q.innerHTML = open ? c.short : c.full; more.setAttribute("aria-expanded", String(!open)); more.textContent = open ? "원문 전체 보기" : "답에 쓰인 호만 보기"; };
    wrap.append(more);
  }
  return wrap;
}

// 질문은 오른쪽 말풍선으로 보여 줍니다
function echo(question) {
  return el("div", { class: "q-echo" }, `<p class="q-bubble"><span class="sr-only">질문한 내용: </span>${esc(question)}</p>`);

function showLoading(question) {
  const started = Date.now();
  const box = el("div", { class: "loading bot-card", "aria-busy": "true" });
  const speeds = [[2.6, 0], [3.4, -1.2], [2.2, -0.6], [3.0, -2.1], [3.8, -0.3], [2.8, -1.7]];
  box.innerHTML = `<div class="status"><svg class="spinner" viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="9.5"/><circle class="arc" cx="12" cy="12" r="9.5"/></svg><span id="status-text">관련 서울시 조례를 찾는 중이에요</span><small id="elapsed">0초</small></div>

  const graph = data.graph && data.graph.nodes ? data.graph : null;

  const tabs = [{ key: "src", label: "근거 원문", short: "근거 원문", count: evidence.length, panel: sourcesPanel(data, graph) }];

// ---- 지도 데이터: 서버가 보낸 graph(nodes, edges, related)만으로 4열(질문, 답변 근거, 연결 고리, 다른 조례 조항)을 만듭니다 ----
const HUB = { target: "같은 대상", term: "같은 용어", topic: "같은 주제" };
// 받침에 따라 '으로/로'를 붙입니다(받침 없음이나 ㄹ 받침은 '로')
const ro = (w) => { const c = String(w).charCodeAt(String(w).length - 1) - 0xac00; const j = c >= 0 && c < 11172 ? c % 28 : 0; return `${w}${j && j !== 8 ? "으로" : "로"}`; };
function mapModel(graph) {
  const nodes = graph.nodes || [], edges = graph.edges || [];
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const cited = nodes.filter((n) => n.role === "cited");
  const relatedNodes = nodes.filter((n) => n.role === "related");
  const isArt = (n) => n && (n.role === "cited" || n.role === "related");
  const links = [], direct = [], extras = new Map();
  for (const e of edges) {
    const a = byId.get(e.src), b = byId.get(e.dst);
    if (!a || !b || a.role === "question" || b.role === "question") continue;
    if (HUB[b.role] && isArt(a)) links.push({ art: a.id, hub: b.id, e });
    else if (HUB[a.role] && isArt(b)) links.push({ art: b.id, hub: a.id, e });
    else if (isArt(a) && isArt(b) && a.role !== b.role) direct.push({ cited: a.role === "cited" ? a.id : b.id, rel: a.role === "related" ? a.id : b.id, e });
    else {
      // 답변 근거와 같은 조례의 다른 조항, 상위 법령, 위임, 개정 이력 등은 답변 근거 아래 '지선'으로 모읍니다
      const c = a.role === "cited" ? a : b.role === "cited" ? b : null, o = c === a ? b : a;
      if (c && o && o.role !== "ordinance" && !HUB[o.role] && !isArt(o) && !extras.has(o.id)) extras.set(o.id, { node: o, label: e.label, reason: e.reason, cited: c.id });
    }
  }
  const relIds = new Set(relatedNodes.map((n) => n.id));
  const hubIds = [...new Set(links.filter((l) => relIds.has(l.art)).map((l) => l.hub))];
  const order = (id) => relatedNodes.findIndex((n) => n.id === id);
  const avg = (h) => { const xs = links.filter((l) => l.hub === h && relIds.has(l.art)).map((l) => order(l.art)); return xs.reduce((s, x) => s + x, 0) / xs.length; };
  const roleRank = { target: 0, term: 1, topic: 2 };
  const hubs = hubIds.map((id) => byId.get(id)).sort((a, b) => roleRank[a.role] - roleRank[b.role] || avg(a.id) - avg(b.id));
  const hubSet = new Set(hubIds), hubOrder = hubs.map((h) => h.id);
  const L = links.filter((l) => hubSet.has(l.hub));
  // 다른 조례 조항은 조례별로 묶고, 연결 고리 순서(위에서 아래)를 따라 놓아 선이 덜 엇갈리게 합니다
  const pos = (id) => { const xs = L.filter((l) => l.art === id).map((l) => hubOrder.indexOf(l.hub)); return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : 99; };
  const groups = [];
  for (const n of [...relatedNodes].sort((a, b) => pos(a.id) - pos(b.id))) { let g = groups.find((x) => x.law === n.law); if (!g) groups.push(g = { law: n.law, items: [] }); g.items.push(n); }
  const gpos = (g) => g.items.reduce((s, n) => s + pos(n.id), 0) / g.items.length;
  groups.sort((a, b) => gpos(a) - gpos(b));
  const relIndex = new Map((graph.related || []).map((r, i) => [r.label, i]));
  return { nodes, byId, cited, related: relatedNodes, hubs, links: L, direct, extras: [...extras.values()], groups, relIndex,
    hubsOf: (id) => L.filter((l) => l.art === id).map((l) => byId.get(l.hub)),
    artsOf: (hubId) => L.filter((l) => l.hub === hubId).map((l) => byId.get(l.art)) };
}

const NS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs = {}, text) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text !== undefined) n.textContent = text; return n; };

// 가로-45도-가로로 꺾이는 노선. 꺾이는 곳은 둥글게 처리합니다
function routePath(x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, ady = Math.abs(dy);
  if (ady < 0.5) return `M${x1} ${y1}H${x2}`;
  if (Math.abs(dx) < 0.5) return `M${x1} ${y1}V${y2}`;
  const diag = Math.min(ady, Math.max(Math.abs(dx) - 24, 0)), h1 = (Math.abs(dx) - diag) / 2, sx = Math.sign(dx);
  const pts = [[x1, y1], [x1 + sx * h1, y1], [x2 - sx * h1, y2], [x2, y2]];
  return roundPath(pts, Math.min(14, h1));
}
// 꺾은선의 모서리를 둥글게
function roundPath(pts, r) {
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(cx - px, cy - py), l2 = Math.hypot(nx - cx, ny - cy);
    const a = Math.min(r, l1 / 2), b = Math.min(r, l2 / 2);
    d += `L${cx - (cx - px) / l1 * a} ${cy - (cy - py) / l1 * a}Q${cx} ${cy} ${cx + (nx - cx) / l2 * b} ${cy + (ny - cy) / l2 * b}`;
  }
  const [x2, y2] = pts[pts.length - 1];
  return d + `L${x2} ${y2}`;
}

// 글자 폭에 맞춰 자르기(넘치면 …). 화면에 붙은 뒤에 재야 정확해서 그린 다음과 글꼴을 다 받은 뒤에 한 번 더 맞춥니다
function fitText(t, max) {
  const full = t.dataset.full ?? t.textContent;
  t.dataset.full = full;
  const tsp = t.querySelector("tspan.rest");
  const target = tsp || t;
  const base = tsp ? tsp.dataset.full ?? tsp.textContent : full;
  if (tsp) tsp.dataset.full = base;
  target.textContent = base;
  if (!t.getComputedTextLength || t.getComputedTextLength() <= max) return;
  let lo = 0, hi = base.length;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; target.textContent = base.slice(0, mid) + "…"; if (t.getComputedTextLength() <= max) lo = mid; else hi = mid - 1; }
  target.textContent = base.slice(0, lo) + "…";
}

function routeMap(m) {
  const W = 1120, xQ = 64, xC = 300, xT = 590, xR = 820, top = 72;
  const hubY = new Map(), relY = new Map(), heads = [], badges = [];
  let y = top;
  let lastRole = null;
  for (const h of m.hubs) {
    if (HUB[h.role] !== lastRole) { if (lastRole) y += 16; heads.push([HUB[h.role], y]); y += 34; lastRole = HUB[h.role]; }
    hubY.set(h.id, y + 15); y += 48;
  }
  const hubBottom = y;
  y = top;
  for (const g of m.groups) {
    badges.push([g, y]); y += 44;
    g.ys = [];
    for (const n of g.items) { relY.set(n.id, y + 8); g.ys.push(y + 8); y += 48; }
    y += 18;
  }
  const relBottom = y;
  const contentBottom = Math.max(hubBottom, relBottom);
  const nC = m.cited.length, gapC = 104;
  let yc = Math.round((top + contentBottom) / 2);
  yc = Math.max(yc, top + 40 + (nC - 1) * gapC / 2);
  const citedY = new Map(m.cited.map((c, i) => [c.id, yc + (i - (nC - 1) / 2) * gapC]));
  const lastCY = yc + (nC - 1) * gapC / 2;
  const exTop = lastCY + (nC > 1 ? 120 : 86);
  const H = Math.ceil(Math.max(contentBottom + 16, m.extras.length ? exTop + m.extras.length * 40 + 8 : 0, lastCY + 64));

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "group", "aria-label": `연관 조례 지도: 답변 근거 ${m.cited.map((c) => shortArticle(c.id, c.law)).join(", ")}에서 다른 조례 조항 ${m.related.length}개로 이어짐` });
  const gRoutes = svgEl("g"), gNodes = svgEl("g");
  svg.append(gRoutes, gNodes);
  const route = (x1, y1, x2, y2, color, w, a, b, extra = {}) => {
    const p = svgEl("path", { d: routePath(x1, y1, x2, y2), fill: "none", stroke: color, "stroke-width": w, "stroke-linecap": "round", "stroke-linejoin": "round", class: "kg-route", "data-a": a, "data-b": b, ...extra });
    gRoutes.append(p); return p;
  };
  const text = (s, attrs) => svgEl("text", { "font-size": 13, fill: "var(--ink-3)", ...attrs }, s);

  // 열 제목
  [["질문", xQ, "middle"], ["답변 근거", xC, "middle"], ["연결 고리", xT, "middle"], ["다른 조례 조항", xR - 8, "start"]]
    .forEach(([s, x, anchor]) => gNodes.append(text(s, { x, y: 36, "text-anchor": anchor, "font-weight": 500 })));

  // 선: 질문 → 답변 근거 → 연결 고리 → 다른 조례 조항
  for (const c of m.cited) {
    const cy = citedY.get(c.id), dy = Math.abs(cy - yc);
    const p = route(xQ, yc, xC, cy, "var(--ink)", 4, "질문", c.id);
    if (dy > 0.5) p.setAttribute("d", roundPath([[xQ, yc], [xC - 18 - dy, yc], [xC - 18, cy], [xC, cy]], 14));
  }
  for (const l of m.links) {
    const art = m.byId.get(l.art), hub = m.byId.get(l.hub), thin = hub.role === "topic", w = thin ? 2.5 : 4, x = thin ? { "data-thin": "1" } : {};
    if (art.role === "cited") route(xC, citedY.get(art.id), xT, hubY.get(hub.id), ordColor(art.law), w, art.id, hub.id, x);
    else route(xT, hubY.get(hub.id), xR, relY.get(art.id), ordColor(art.law), w, hub.id, art.id, x);
  }
  for (const d of m.direct) { const r = m.byId.get(d.rel); const p = route(xC, citedY.get(d.cited), xR, relY.get(d.rel), ordColor(r.law), 2.5, d.cited, d.rel, { "stroke-dasharray": "2 6" }); p.append(svgEl("title", {}, d.e.label)); }
  // 같은 조례 안의 조항을 잇는 세로 노선
  for (const g of m.groups) if (g.ys.length > 1) route(xR, g.ys[0], xR, g.ys[g.ys.length - 1], ordColor(g.law), 4, `law:${g.law}`, `law:${g.law}`, { "data-law": g.law });
  // 답변 근거의 지선(같은 조례의 다른 조항, 상위 법령 등)
  if (m.extras.length) route(xC, lastCY, xC, exTop + (m.extras.length - 1) * 40, ordColor(m.cited[m.cited.length - 1].law), 2.5, "extra", "extra", { "stroke-opacity": 0.35, "data-extra": "1" });

  // 질문 역
  const q = svgEl("g", { class: "kg-el", "data-id": "질문" });
  q.append(svgEl("circle", { cx: xQ, cy: yc, r: 11, fill: "var(--ink)" }), text("질문", { x: xQ, y: yc + 34, "text-anchor": "middle", "font-size": 15, "font-weight": 700, fill: "var(--ink)" }));
  gNodes.append(q);

  // 답변 근거 역
  m.cited.forEach((c, i) => {
    const cy = citedY.get(c.id), below = i > 0, ly = below ? cy + 40 : cy - 34;
    const g = svgEl("g", { class: "kg-el kg-hit", "data-id": c.id, tabindex: 0, role: "button", "aria-label": `답변 근거 ${shortArticle(c.id, c.law)} ${c.title}` });
    g.append(svgEl("circle", { cx: xC, cy, r: 22, fill: "var(--primary-wash)", class: "ring" }));
    g.append(svgEl("circle", { cx: xC, cy, r: 13, fill: "var(--primary-ink)", stroke: "var(--card)", "stroke-width": 4 }));
    const t1 = text(shortArticle(c.id, c.law), { x: xC - 30, y: ly, "text-anchor": "end", "font-size": 17, "font-weight": 700, fill: "var(--primary-ink)", class: "fit", "data-max": 230 });
    const t2 = text(c.title || "", { x: xC - 30, y: ly + 20, "text-anchor": "end", "font-size": 13, fill: "var(--ink-2)", class: "fit", "data-max": 230 });
    g.append(t1, t2, svgEl("title", {}, `${c.id} (${c.title})`));
    gNodes.append(g);
  });
  // 지선 역
  if (m.extras.length) gNodes.append(text("같은 조례·상위 법령", { x: xC - 22, y: exTop - 26, "text-anchor": "end", "font-size": 12, "font-weight": 500, class: "kg-el", "data-extra": "1" }));
  m.extras.forEach((x, i) => {
    const yy = exTop + i * 40, n = x.node;
    const g = svgEl("g", { class: "kg-el", "data-extra": "1", opacity: 0.6 });
    const name = n.kind === "article" || n.kind === "annex" ? `${articleOnly(n.id)} ${n.title || ""}` : n.name;
    g.append(svgEl("circle", { cx: xC, cy: yy, r: 5, fill: "var(--card)", stroke: n.law ? ordColor(n.law) : "var(--ink-3)", "stroke-width": 2 }));
    g.append(text(name, { x: xC - 18, y: yy - 2, "text-anchor": "end", "font-weight": 500, fill: "var(--ink-2)", class: "fit", "data-max": 220 }));
    g.append(text(x.label || "", { x: xC - 18, y: yy + 14, "text-anchor": "end", "font-size": 11 }));
    g.append(svgEl("title", {}, `${n.id}${x.reason ? `: ${x.reason}` : ""}`));
    gNodes.append(g);
  });

  // 연결 고리(환승역)
  for (const [s, yy] of heads) gNodes.append(text(s, { x: xT, y: yy + 14, "text-anchor": "middle", "font-size": 12, "font-weight": 500, class: "kg-el", "data-head": s }));
  for (const h of m.hubs) {
    const yy = hubY.get(h.id);
    const g = svgEl("g", { class: "kg-el kg-hit kg-pill", "data-id": h.id, tabindex: 0, role: "button", "aria-label": `${HUB[h.role]} ${h.name}로 이어진 조항 보기` });
    const label = h.role === "topic" ? `#${h.name}` : h.name;
    g.append(svgEl("rect", { x: xT - 50, y: yy - 15, width: 100, height: 30, rx: 15, fill: "var(--card)", stroke: "var(--ink)", "stroke-width": 2.5, class: "ring" }));
    g.append(text(label, { x: xT, y: yy + 5, "text-anchor": "middle", "font-size": 14, "font-weight": 700, fill: "var(--ink)" }));
    gNodes.append(g);
  }

  // 다른 조례 조항(역)
  for (const [g, yy] of badges) {
    const b = svgEl("g", { class: "kg-el", "data-law": g.law });
    const label = ordShort(g.law);
    b.append(svgEl("rect", { x: xR - 12, y: yy, width: 20 + label.length * 12.5, height: 22, rx: 11, fill: ordColor(g.law), class: "badge-bg" }));
    b.append(text(label, { x: xR - 2, y: yy + 15.5, "font-size": 12, "font-weight": 700, fill: "#fff", class: "badge-t" }));
    gNodes.append(b);
  }
  for (const n of m.related) {
    const yy = relY.get(n.id);
    const g = svgEl("g", { class: "kg-el kg-hit", "data-id": n.id, tabindex: 0, role: "button", "aria-label": `${shortArticle(n.id, n.law)} ${n.title}: 연결 보기` });
    g.append(svgEl("circle", { cx: xR, cy: yy, r: 19, fill: "transparent", class: "ring halo" }));
    g.append(svgEl("circle", { cx: xR, cy: yy, r: 9, fill: "var(--card)", stroke: ordColor(n.law), "stroke-width": 4 }));
    const t = text("", { x: xR + 24, y: yy + 5, "font-size": 15, fill: "var(--ink)", class: "fit", "data-max": W - xR - 40 });
    t.append(svgEl("tspan", { "font-weight": 700 }, articleOnly(n.id)), svgEl("tspan", { class: "rest" }, `  ${n.title || ""}`));
    g.append(t, svgEl("title", {}, `${n.id} (${n.title})`));
    // 글자까지 누를 수 있게 투명한 판을 깝니다
    g.prepend(svgEl("rect", { x: xR - 20, y: yy - 20, width: W - xR, height: 40, fill: "transparent" }));
    gNodes.append(g);
  }

  svg.addEventListener("click", (e) => { const g = e.target.closest(".kg-hit"); select(g ? (current.selected === g.dataset.id ? null : g.dataset.id) : null); });
  svg.addEventListener("keydown", (e) => { const g = e.target.closest(".kg-hit"); if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); select(current.selected === g.dataset.id ? null : g.dataset.id); } });
  const fit = () => {
    svg.querySelectorAll("text.fit").forEach((t) => fitText(t, +t.dataset.max));
    svg.querySelectorAll(".kg-pill").forEach((g) => { const t = g.querySelector("text"), r = g.querySelector("rect"); const w = t.getComputedTextLength() + 30; r.setAttribute("x", xT - w / 2); r.setAttribute("width", w); });
    svg.querySelectorAll("g[data-law]").forEach((g) => { const t = g.querySelector(".badge-t"), r = g.querySelector(".badge-bg"); if (t && r) r.setAttribute("width", t.getComputedTextLength() + 20); });
  };
  requestAnimationFrame(fit);
  document.fonts && document.fonts.ready.then(() => requestAnimationFrame(fit));
  return svg;
}

// 선택한 조항·연결 고리의 길만 밝히고, 나머지는 흐리게 합니다
function select(id, silent) {
  if (!current) return;
  const m = current.model;
  if (id && !m.byId.has(id)) id = null;
  current.selected = id;
  const svg = document.querySelector(".kg-box svg");
  const info = $("#kg-info");
  if (!svg || !info) return;
  let lit = null;
  if (id) {
    const n = m.byId.get(id);
    lit = new Set(["질문", id]);
    if (n.role === "related") {
      m.hubsOf(id).forEach((h) => { lit.add(h.id); m.artsOf(h.id).filter((a) => a.role === "cited").forEach((c) => lit.add(c.id)); });
      m.direct.filter((d) => d.rel === id).forEach((d) => lit.add(d.cited));
      if (![...lit].some((x) => m.byId.get(x)?.role === "cited")) m.cited.forEach((c) => lit.add(c.id));
    } else if (HUB[n.role]) {
      m.artsOf(id).forEach((a) => lit.add(a.id));
    } else if (n.role === "cited") {
      m.hubsOf(id).forEach((h) => { lit.add(h.id); m.artsOf(h.id).forEach((a) => lit.add(a.id)); });
      m.direct.filter((d) => d.cited === id).forEach((d) => lit.add(d.rel));
    }
  }
  const on = (x) => !lit || lit.has(x);
  const litLaws = lit ? new Set([...lit].map((x) => m.byId.get(x)).filter((n) => n && n.role === "related").map((n) => n.law)) : null;
  svg.querySelectorAll(".kg-route").forEach((p) => {
    let v;
    if (p.dataset.law) v = !lit || litLaws.has(p.dataset.law);
    else if (p.dataset.extra) v = !lit || m.byId.get(id)?.role === "cited";
    else v = on(p.dataset.a) && on(p.dataset.b);
    p.style.opacity = !v ? 0.13 : !lit && p.dataset.thin ? 0.5 : 1;
  });
  svg.querySelectorAll(".kg-el").forEach((g) => {
    let v;
    if (g.dataset.id) v = on(g.dataset.id);
    else if (g.dataset.law) v = !lit || litLaws.has(g.dataset.law);
    else if (g.dataset.extra) v = !lit || m.byId.get(id)?.role === "cited";
    else v = !lit;
    g.style.opacity = v ? "" : (g.dataset.head ? 0.5 : 0.28);
    g.classList.toggle("is-on", !!id && g.dataset.id === id);
    const halo = g.querySelector(".halo");
    if (halo) halo.setAttribute("fill", id && g.dataset.id === id ? "var(--primary-wash)" : "transparent");
    if (g.getAttribute("role") === "button") g.setAttribute("aria-pressed", String(!!id && g.dataset.id === id));
  });
  info.replaceChildren(...infoContent(m, id));
  if (!silent && id) live.textContent = `${info.querySelector("strong")?.textContent || ""} 연결을 표시했습니다.`;
}

// 질문과 두 글자 이상 겹치는 낱말이 가장 많은 연결 이유(예: '다둥이' 질문이면 다둥이 행복카드 호)를 고릅니다
function pickReason(reasons, question) {
  const grams = new Set(); const q = String(question || "").replace(/\s+/g, "");
  for (let i = 0; i < q.length - 1; i++) grams.add(q.slice(i, i + 2));
  const score = (r) => { let n = 0; for (const g of grams) if (r.includes(g)) n++; return n; };
  return reasons.reduce((best, r) => (best === undefined || score(r) > score(best) ? r : best), undefined);
}

function infoContent(m, id) {
  if (!id) return [el("p", { class: "hint" }, "조항이나 연결 고리를 누르면 그 길만 밝게 보여요. 다시 누르거나 Esc를 누르면 전체 지도로 돌아가요.")];
  const n = m.byId.get(id);
  const txt = el("div", { class: "txt" }), act = el("div", { class: "act" });
  const head = el("div", { class: "head" });
  txt.append(head);
  const names = (arr) => arr.map((x) => x.role === "topic" ? `#${x.name}` : x.name).join(", ");
  if (n.role === "related") {
    head.append(el("span", { class: "badge", style: `--c:${ordColor(n.law)}` }, esc(ordShort(n.law))), el("strong", {}, `${esc(articleOnly(n.id))} ${esc(n.title)}`));
    const hs = m.hubsOf(id), t = hs.filter((h) => h.role === "target"), u = hs.filter((h) => h.role === "term"), p = hs.filter((h) => h.role === "topic");
    const s = [];
    if (t.length) s.push(`답변 근거와 같은 대상 ${t.length}개로 이어져요. ${names(t)}.`);
    if (u.length) s.push(`같은 용어 ${u.length}개로 이어져요. ${names(u)}.`);
    if (p.length) s.push(`같은 주제 ${p.length}개로 이어져요. ${names(p)}.`);
    if (!s.length) s.push("답변 근거 조항이 이 조항을 직접 언급해요.");
    txt.append(el("p", { class: "desc" }, esc(s.join(" "))));
    const i = m.relIndex.get(id);
    const r = current.graph.related && current.graph.related[i];
    const reason = r && pickReason((r.reasons || []).filter((x) => x.includes(": ")), current.question);
    if (reason) txt.append(el("p", { class: "qt" }, `「${esc(reason.split(": ").slice(1).join(": "))}」`));
    const b = el("button", { type: "button", class: "btn btn-quiet" }, "원문 펼쳐 보기");
    b.onclick = () => openRelated(id);
    act.append(b);
  } else if (HUB[n.role]) {
    head.append(el("span", { class: "hub-tag" }, esc(n.role === "topic" ? `#${n.name}` : n.name)), el("strong", {}, esc(HUB[n.role])));
    const arts = m.artsOf(id), rel = arts.filter((a) => a.role === "related"), cit = arts.filter((a) => a.role === "cited");
    txt.append(el("p", { class: "desc" }, esc(`${cit.length ? `답변 근거(${cit.map((c) => shortArticle(c.id, c.law)).join(", ")})와 ` : ""}다른 조례 조항 ${rel.length}개가 이 ${ro(HUB[n.role].replace("같은 ", ""))} 이어져요. ${rel.map((a) => shortArticle(a.id, a.law)).join(", ")}.`)));
  } else if (n.role === "cited") {
    head.append(el("span", { class: "badge", style: "--c:var(--primary-ink)" }, "답변 근거"), el("strong", {}, `${esc(shortArticle(n.id, n.law))} ${esc(n.title)}`));
    const hs = m.hubsOf(id), rel = new Set(hs.flatMap((h) => m.artsOf(h.id)).filter((a) => a.role === "related").map((a) => a.id));
    txt.append(el("p", { class: "desc" }, esc(`이 질문의 답변 근거예요. 연결 고리 ${hs.length}개를 따라 다른 조례 조항 ${rel.size}개로 이어져요.`)));
    const b = el("button", { type: "button", class: "btn btn-quiet" }, "근거 원문 보기");
    b.onclick = () => { const k = [...document.querySelectorAll(".sources .source")].findIndex((x) => x.querySelector(".title").title.startsWith(n.id)); openSource(Math.max(k, 0)); };
    act.append(b);
  }
  act.append(el("small", {}, "Esc를 누르면 전체 지도로 돌아가요"));
  return [txt, act];
}

function legend(m) {
  const ul = el("ul", { class: "legend", "aria-hidden": "true" });
  const add = (icon, label) => ul.append(el("li", {}, `${icon}${esc(label)}`));
  add('<i style="width:14px;height:14px;border-radius:50%;background:var(--primary-ink)"></i>', "답변 근거");
  add('<i style="width:12px;height:12px;border-radius:50%;border:3px solid var(--ink-2);box-sizing:border-box"></i>', "다른 조례 조항");
  add('<i style="width:22px;height:14px;border-radius:7px;border:2px solid var(--ink);box-sizing:border-box"></i>', "연결 고리");
  if (m.hubs.some((h) => h.role !== "topic")) add('<i style="width:24px;height:4px;border-radius:2px;background:var(--ink-3)"></i>', "같은 대상·용어");
  if (m.hubs.some((h) => h.role === "topic")) add('<i style="width:24px;height:2px;background:var(--ink-3)"></i>', "같은 주제");
  const laws = [...new Set([...m.cited, ...m.related].map((n) => ordKey(n.law)).filter(Boolean))];
  laws.forEach((k) => add(`<i style="width:24px;height:4px;border-radius:2px;background:var(--ord-${k})"></i>`, `${k} 조례`));
  return ul;
}

// 좁은 화면: 질문에서 아래로 내려가는 세로 노선
function verticalMap(m) {
  const ol = el("ol", { class: "kg-v", "aria-label": "연관 조례 지도" });
  const item = (color, station, body, cls = "") => { const li = el("li", { class: cls, style: `--c:${color}` }); const rl = el("span", { class: "rl", "aria-hidden": "true" }, station); li.append(rl, body); ol.append(li); return li; };
  item("var(--ink)", '<span class="st q"></span>', el("div", { class: "bd" }, "<b>질문</b>"));
  for (const c of m.cited) item(ordColor(c.law), '<span class="st cited"></span>', el("div", { class: "bd" }, `<b>${esc(shortArticle(c.id, c.law))}</b><span>${esc(c.title)} (답변 근거)</span>`), "cited");
  const byRole = {};
  m.hubs.forEach((h) => (byRole[HUB[h.role]] ||= []).push(h));
  for (const [label, hs] of Object.entries(byRole)) {
    item("var(--line)", "", el("div", { class: "bd" }, `<span class="cap">${esc(ro(label))} 이어져요</span><div class="pills">${hs.map((h) => `<span>${esc(h.role === "topic" ? `#${h.name}` : h.name)}</span>`).join("")}</div>`));
  }
  for (const g of m.groups) {
    item(ordColor(g.law), "", el("div", { class: "bd grp" }, `<span class="badge" style="--c:${ordColor(g.law)}">${esc(ordShort(g.law))}</span>`));
    for (const n of g.items) {
      const body = el("div", { class: "bd" });
      const b = el("button", { type: "button" }, `${esc(articleOnly(n.id))} ${esc(n.title)}`);
      b.onclick = () => openRelated(n.id);
      const hs = m.hubsOf(n.id), t = hs.filter((h) => h.role !== "topic").length, p = hs.length - t;
      body.append(b, el("span", {}, esc([t && `같은 대상 ${t}개`, p && `같은 주제 ${p}개`].filter(Boolean).join(", ") || "직접 언급")));
      item(ordColor(g.law), '<span class="st"></span>', body);
    }
  }
  return ol;
}

function renderState(question, kind, savedAt) {
  const box = el("div", { class: `state state-${kind === "error" ? "error" : "unknown"}` });
  const frag = [];
  if (kind === "unknown") {
    // 근거가 없을 때는 연관 조례 지도를 그리지 않습니다. 검색에만 걸린 조례를 보여 주면 관련 규정이 있다고 오해하기 쉽습니다.
    box.innerHTML = `<h2>${ICON.info}확인 불가</h2>
      <p>서울시 조례 6종에서 이 질문에 답할 근거를 찾지 못했어요. 관련 규정이 없다는 뜻은 아니에요.</p>
      <p>자치구 조례나 국가 법령에 관한 내용이라면 120 다산콜재단에 문의해 주세요.</p>
      <p class="about">SolarLex는 서울시 조례 6종 원문에서 근거 조항을 찾아 답해요. 근거가 없을 때는 지어내지 않고 이렇게 확인 불가로 알려 드려요.</p>`;
    const next = el("div", { class: "next-questions" }, `<p>이런 질문에는 답할 수 있어요.</p>`);
    EXAMPLES.slice(0, 3).forEach((q) => { const b = el("button", { type: "button", class: "btn btn-quiet" }, esc(q)); b.onclick = () => ask(q); next.append(b); });
    box.append(next);
    live.textContent = "확인 불가. 조례에서 근거를 찾지 못했습니다.";
    if (savedAt) frag.push(offlineNote(savedAt));
  } else if (kind === "offline") {
    box.innerHTML = `<h2>${ICON.info}저장해 둔 질문만 답할 수 있어요</h2>
      <p>지금은 네트워크 없이 미리 저장한 답변으로 시연하고 있어요. 질문칸을 비운 채 질문하기를 누르면 질문칸에 보이는 예시 질문으로 물어볼 수 있어요.</p>`;
    live.textContent = "오프라인 시연 모드입니다. 저장해 둔 질문만 답할 수 있습니다.";
  } else {
    box.innerHTML = `<h2>${ICON.alert}답변을 불러오지 못했어요</h2><p>서버와 연결하는 중에 문제가 생겼어요. 잠시 뒤 다시 시도해 주세요.</p>`;
    const retry = el("button", { type: "button", class: "btn btn-quiet" }, "다시 시도");
    retry.onclick = () => ask(question);
    box.append(retry);
    live.textContent = "답변을 불러오지 못했습니다.";
  }
  current = null;
  result.replaceChildren(echo(question), botReply(...frag, box));
}

function markChips(question) {
  document.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-current", String(b.dataset.q === question)));
}

// ---- 음성: 말로 묻기(녹음 → /demo/stt)와 답 듣기(/demo/tts → 재생). 서버에 음성 키가 없으면 버튼을 숨깁니다 ----
const mic = $("#mic");
let voiceOn = false, recorder = null, speaking = null;
fetch("/health").then((r) => r.json()).then((h) => {
  voiceOn = Boolean(h.voice);
  mic.hidden = !(voiceOn && navigator.mediaDevices && window.MediaRecorder);
  document.querySelectorAll(".listen").forEach((n) => { n.hidden = !voiceOn; });
}).catch(() => {});

async function startRecording() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = (e) => chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    const audio = new Blob(chunks, { type: recorder.mimeType });
    recorder = null;
    mic.setAttribute("aria-pressed", "false"); mic.disabled = true;
    live.textContent = "말씀하신 내용을 글로 바꾸고 있어요.";
    try {
      const res = await fetch("/demo/stt", { method: "POST", headers: { "Content-Type": audio.type }, body: audio });
      if (!res.ok) throw new Error(String(res.status));
      const { text } = await res.json();
      input.value = text; input.dispatchEvent(new Event("input")); input.focus();
      live.textContent = text ? "받아 적었어요. 맞으면 질문하기를 눌러 주세요." : "알아듣지 못했어요. 다시 말씀해 주세요.";
    } catch (e) {
      live.textContent = "음성을 글로 바꾸지 못했어요. 글로 입력해 주세요.";
    } finally { mic.disabled = false; }
  };
  recorder.start();
  mic.setAttribute("aria-pressed", "true");
  live.textContent = "듣고 있어요. 다 말씀하시면 마이크를 한 번 더 눌러 주세요.";
  setTimeout(() => { if (recorder && recorder.state === "recording") recorder.stop(); }, 20000);
}
mic.addEventListener("click", () => {
  if (recorder && recorder.state === "recording") return recorder.stop();
  startRecording().catch(() => { live.textContent = "마이크를 쓸 수 없어요. 브라우저의 마이크 권한을 확인해 주세요."; });
});

function listenRow(answer) {
  const row = el("p", { class: "listen" });
  row.hidden = !voiceOn;
  const b = el("button", { type: "button", class: "btn btn-quiet" }, "답 듣기");
  b.onclick = async () => {
    if (speaking) { speaking.pause(); speaking = null; b.textContent = "답 듣기"; return; }
    b.disabled = true; b.textContent = "준비 중…";
    try {
      const res = await fetch("/demo/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: answer.slice(0, 1000) }) });
      if (!res.ok) throw new Error(String(res.status));
      speaking = new Audio(URL.createObjectURL(await res.blob()));
      speaking.onended = () => { speaking = null; b.textContent = "답 듣기"; };
      await speaking.play();
      b.textContent = "멈추기";
    } catch (e) { speaking = null; b.textContent = "답 듣기"; live.textContent = "음성으로 읽어 드리지 못했어요."; }
    finally { b.disabled = false; }
  };
  row.append(b, el("span", {}, "AI가 생성한 음성으로 읽어 드려요."));
  return row;
}

// 요청마다 자기 것(mine)을 기억합니다. 홈으로 가거나 새 질문을 보내 주인이 바뀐 요청은 끝나도 화면을 건드리지 않습니다.
function setBusy(busy) {
  input.readOnly = busy;
  submit.disabled = busy; submit.textContent = busy ? "찾는 중…" : "질문하기";
}

function showAddress(question) {
  const next = question ? `?q=${encodeURIComponent(question)}` : location.pathname;
  if (location.search !== (question ? next : "")) history.pushState({}, "", next);
}

function goHome(keepQuestion = "") {
  controller?.abort(); controller = null; clearInterval(tick);
  setBusy(false);
  current = null; result.replaceChildren(); input.value = keepQuestion; markChips(null);
  live.textContent = "";
  document.body.classList.remove("asked");
  window.scrollTo({ top: 0 }); input.focus();
}

async function ask(question) {
  const mine = new AbortController();
  controller?.abort(); clearInterval(tick);
  controller = mine;
  document.body.classList.add("asked");
  input.value = question; markChips(question);
  setBusy(true);
  showAddress(question);
  showLoading(question);
  result.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
  try {
    const res = await fetch("/demo/ask", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }), signal: mine.signal });
    if (!res.ok) throw new Error(String(res.status));
    const data = await res.json();
    if (controller !== mine) return;
    if (data.missing) renderState(question, "offline");
    else if (!data.citation || data.citation.length === 0) renderState(question, "unknown", data.offline && data.saved_at);
    else renderAnswer(question, data);
  } catch (e) {
    if (controller !== mine) return;
    renderState(question, "error");
  } finally {
    if (controller === mine) {
      controller = null; clearInterval(tick);
      setBusy(false);
    }
  }
}

document.querySelectorAll("[data-ord]").forEach((n) => { n.outerHTML = ordIcon(n.dataset.ord, n.className.replace("oi", "").trim()); });
form.addEventListener("submit", (e) => { e.preventDefault(); if (controller) return; const q = input.value.trim(); ask(q || EXAMPLES[exIdx]); });
input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); } });
document.querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => ask(b.dataset.q)));
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && current && current.selected) { const id = current.selected; select(null); document.querySelector(`.kg-hit[data-id="${CSS.escape(id)}"]`)?.focus(); } });
NARROW.addEventListener("change", () => { if (!current || !current.mapDrawn) return; if ($("#panel-map") && !$("#panel-map").hidden) drawMap(); else current.mapDrawn = false; });
$("#home-link").addEventListener("click", (e) => { e.preventDefault(); showAddress(""); goHome(); });
const askedInAddress = () => new URLSearchParams(location.search).get("q");
window.addEventListener("popstate", () => { const q = askedInAddress(); if (q) ask(q); else goHome(); });
// ---- 질문칸 안내 문구: 예시 질문을 타자 치듯 하나씩 보여 줍니다 ----
const EXAMPLES = ["저 27살인데 서울시 청년 정책 대상에 들어가나요?", "첫 차로 경차를 샀는데 서울 공영주차장에서 할인되나요?", "서울시 청년 월세 지원금은 한 달에 얼마인가요?", "따릉이 1시간 이용요금이 얼마예요?", "서울 금연구역에서 담배 피우다 걸리면 과태료가 얼마예요?", "자취방에서 유기견을 입양하면 동물등록 수수료를 내야 하나요?"];
let exIdx = 0;
if (askedInAddress()) ask(askedInAddress());
(function typeExamples() {
  const PRE = "예) ", TYPE = 70, ERASE = 28, HOLD = 2400, GAP = 450;
  const set = (t) => input.setAttribute("placeholder", t);
  if (reduceMotion()) {
    set(PRE + EXAMPLES[0]);
    setInterval(() => { exIdx = (exIdx + 1) % EXAMPLES.length; set(PRE + EXAMPLES[exIdx]); }, 4000);
    return;
  }
  const chars = (s) => Array.from(s);
  let n = 0, mode = "type";
  const step = () => {
    const q = chars(EXAMPLES[exIdx]);
    if (mode === "type") {
      n++; set(PRE + q.slice(0, n).join("") + "|");
      if (n >= q.length) { mode = "hold"; return setTimeout(step, HOLD); }
      return setTimeout(step, TYPE + Math.random() * 40);
    }
    if (mode === "hold") { set(PRE + q.join("")); mode = "erase"; return setTimeout(step, 300); }
    n--; set(PRE + q.slice(0, n).join("") + "|");
    if (n <= 0) { mode = "type"; exIdx = (exIdx + 1) % EXAMPLES.length; return setTimeout(step, GAP); }
    setTimeout(step, ERASE);
  };
  step();
})();

// ---- 다크 모드 ----
const themeBtn = $("#theme-toggle");
const applyTheme = (dark) => {
  if (dark) document.documentElement.dataset.theme = "dark"; else delete document.documentElement.dataset.theme;
  themeBtn.setAttribute("aria-pressed", String(dark));
  themeBtn.title = dark ? "밝은 모드" : "다크 모드";
  themeBtn.querySelector(".sr-only").textContent = dark ? "밝은 모드로 바꾸기" : "다크 모드로 바꾸기";
};
applyTheme(document.documentElement.dataset.theme === "dark");
themeBtn.addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  applyTheme(dark);
  try { localStorage.setItem("solarlex-theme", dark ? "dark" : "light"); } catch (e) {}
});
</script>
